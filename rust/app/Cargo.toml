[package]
name = "karaokemuse"
version = "1.0.0"
edition = "2024"
publish = false
description = "KaraokeMuse — karaoke compartido autoalojado (app Rust pura, levantada con rust-anything; el servidor Node queda solo como referencia)"

[[bin]]
name = "karaokemuse"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
# Unidades portadas (ADR-010/ADR-013): karaoke-db y karaoke-auth son
# parte del build de la app; las rutas las usan a través de
# karaoke-routes.
karaoke-db = { path = "../db" }
# (ver ADR-013)
karaoke-auth = { path = "../auth" }
karaoke-routes = { path = "../routes" }
serde_json = "1.0"

[workspace]
