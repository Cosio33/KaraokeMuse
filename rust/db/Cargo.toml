[package]
name = "karaoke-db"
version = "0.1.0"
edition = "2024"
publish = false
description = "Persistencia SQLite de KaraokeMuse: ids, códigos, apertura de BD y seed (port de server/db.js)"

[dependencies]
karaoke-crypto = { path = "../crypto" }
rusqlite = { version = "0.43", features = ["bundled", "limits"] }
serde_json = "1.0"
hex = "0.4"

[dev-dependencies]
serde_json = "1.0"
